[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uwu"
version = "0.1.0"
description = "CLI tool to upload zip files to OpenWebUI RAG endpoint"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "click>=8.1.0",
]

[project.scripts]
uwu = "uwu.main:cli"

[tool.uv]
package = true
